```yaml
---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install common packages
  package:
    name:
      - curl
      - wget
      - vim
      - net-tools
      - htop
      - jq
      - python3-pip
      - apt-transport-https
      - gnupg2
    state: present

- name: Set timezone
  timezone:
    name: "{{ timezone }}"

- name: Configure system limits
  pam_limits:
    domain: "{{ item.domain }}"
    limit_type: "{{ item.type }}"
    limit_item: "{{ item.item }}"
    value: "{{ item.value }}"
  loop:
    - { domain: '*', type: 'soft', item: 'nofile', value: '{{ max_open_files }}' }
    - { domain: '*', type: 'hard', item: 'nofile', value: '{{ max_open_files }}' }
    - { domain: '*', type: 'soft', item: 'memlock', value: 'unlimited' }
    - { domain: '*', type: 'hard', item: 'memlock', value: 'unlimited' }

- name: Configure sysctl
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'vm.max_map_count', value: '{{ max_map_count }}' }
    - { name: 'vm.swappiness', value: '{{ swappiness }}' }
    - { name: 'net.core.somaxconn', value: '32768' }
    - { name: 'net.ipv4.tcp_max_syn_backlog', value: '8192' }

- name: Disable swap
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove swap from fstab
  lineinfile:
    path: /etc/fstab
    regexp: '.*swap.*'
    state: absent

- name: Create ELK directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ elk_base_dir }}"
    - "{{ data_dir }}"
    - "{{ log_dir }}"
    - "{{ backup_dir }}"

- name: Configure firewall
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ elasticsearch_http_port }}"
    - "{{ elasticsearch_transport_port }}"
    - "{{ kibana_port }}"
    - "{{ beats_port }}"
  when: ansible_os_family == "Debian"

- name: Install Java
  package:
    name: "openjdk-{{ java_version }}-jre-headless"
    state: present
```
