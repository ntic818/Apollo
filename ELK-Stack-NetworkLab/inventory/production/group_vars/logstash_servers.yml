```yaml
---
logstash_version: "{{ elk_version }}"
logstash_heap_size_min: 4g
logstash_heap_size_max: 4g

# Logstash configuration
logstash_config_dir: /etc/logstash/conf.d
logstash_pipeline_workers: "{{ ansible_processor_vcpus }}"
logstash_pipeline_batch_size: 1000
logstash_pipeline_batch_delay: 50

# Input configuration
logstash_syslog_port: "{{ syslog_port }}"
logstash_beats_port: "{{ beats_port }}"

# Output configuration
logstash_elasticsearch_hosts:
  - "https://elk-ingest-01:9200"
  - "https://elk-ingest-02:9200"

# Performance
logstash_pipeline_output_workers: 4

# Monitoring
logstash_monitoring_enabled: true
logstash_monitoring_elasticsearch_hosts: "{{ logstash_elasticsearch_hosts }}"

# Dead Letter Queue
logstash_dead_letter_queue_enabled: true
logstash_dead_letter_queue_max_bytes: 1gb
```
