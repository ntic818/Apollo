```ini
# ELK Stack NetworkLab - Production Inventory

[elk_masters]
elk-master-01 ansible_host=10.0.1.11 elasticsearch_node_roles=['master']
elk-master-02 ansible_host=10.0.1.12 elasticsearch_node_roles=['master']
elk-master-03 ansible_host=10.0.1.13 elasticsearch_node_roles=['master']

[elk_data_hot]
elk-data-hot-01 ansible_host=10.0.1.21 elasticsearch_node_roles=['data_hot','data_content']
elk-data-hot-02 ansible_host=10.0.1.22 elasticsearch_node_roles=['data_hot','data_content']
elk-data-hot-03 ansible_host=10.0.1.23 elasticsearch_node_roles=['data_hot','data_content']

[elk_data_warm]
elk-data-warm-01 ansible_host=10.0.1.31 elasticsearch_node_roles=['data_warm']
elk-data-warm-02 ansible_host=10.0.1.32 elasticsearch_node_roles=['data_warm']

[elk_ingest]
elk-ingest-01 ansible_host=10.0.1.41 elasticsearch_node_roles=['ingest']
elk-ingest-02 ansible_host=10.0.1.42 elasticsearch_node_roles=['ingest']

[logstash_servers]
logstash-01 ansible_host=10.0.1.51
logstash-02 ansible_host=10.0.1.52

[kibana_servers]
kibana-01 ansible_host=10.0.1.61
kibana-02 ansible_host=10.0.1.62

[network_devices]
core-rtr-01 ansible_host=10.0.2.1 ansible_network_os=ios device_type=router
core-rtr-02 ansible_host=10.0.2.2 ansible_network_os=ios device_type=router
dist-sw-01 ansible_host=10.0.2.11 ansible_network_os=ios device_type=switch
dist-sw-02 ansible_host=10.0.2.12 ansible_network_os=ios device_type=switch
access-sw-01 ansible_host=10.0.2.21 ansible_network_os=ios device_type=switch
access-sw-02 ansible_host=10.0.2.22 ansible_network_os=ios device_type=switch

[load_balancers]
haproxy-01 ansible_host=10.0.1.71
haproxy-02 ansible_host=10.0.1.72

# Group consolidation
[elk_cluster:children]
elk_masters
elk_data_hot
elk_data_warm
elk_ingest

[elk_data:children]
elk_data_hot
elk_data_warm

[elasticsearch:children]
elk_cluster

[elk_stack:children]
elasticsearch
logstash_servers
kibana_servers

[monitoring_agents:children]
elk_stack
logstash_servers
kibana_servers

# Global variables
[all:vars]
ansible_user=ansible
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_rsa_elk

# Network device variables
[network_devices:vars]
ansible_connection=network_cli
ansible_become=yes
ansible_become_method=enable
```